name: Build Tweak

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos + ldid
        run: |
          brew install theos ldid
          # Detecta path do Theos (Apple Silicon vs Intel)
          if [ -d "/opt/homebrew/opt/theos/libexec/theos" ]; then
            echo "THEOS=/opt/homebrew/opt/theos/libexec/theos" >> $GITHUB_ENV
          elif [ -d "/usr/local/opt/theos/libexec/theos" ]; then
            echo "THEOS=/usr/local/opt/theos/libexec/theos" >> $GITHUB_ENV
          else
            echo "❌ Theos not found after brew install"
            exit 1
          fi

      - name: Build package
        run: |
          make package FINALPACKAGE=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZapTweak-deb
          path: .theos/packages/*.deb

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: .theos/packages/*.deb
          generate_release_notes: true
